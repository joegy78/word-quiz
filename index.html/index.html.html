<html lang="zh-CN">

        .cover-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 30px;
            text-align: center;
        }
        .cover-page.hidden { display: none; }
        .cover-icon { font-size: 72px; margin-bottom: 16px; }
        .cover-title {
            font-size: 34px; font-weight: 800; color: #1a237e;
            margin-bottom: 6px; letter-spacing: 2px;
        }
        .cover-subtitle { font-size: 15px; color: #666; margin-bottom: 28px; }
        .cover-mode-cards {
            display: flex; gap: 16px; flex-wrap: wrap;
            justify-content: center; margin-bottom: 24px;
        }
        .cover-mode-card {
            background: white; border-radius: 20px; padding: 24px 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            cursor: pointer; transition: all 0.3s ease;
            text-align: center; width: 140px;
        }
        .cover-mode-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 40px rgba(0,0,0,0.14);
        }
        .cover-mode-card:active { transform: scale(0.95); }
        .cover-mode-icon { font-size: 44px; margin-bottom: 10px; }
        .cover-mode-name { font-size: 17px; font-weight: 700; color: #1a237e; }
        .cover-mode-desc { font-size: 12px; color: #999; margin-top: 4px; }
        .cover-word-count {
            background: rgba(92,107,192,0.1); color: #5c6bc0;
            padding: 6px 16px; border-radius: 20px;
            font-size: 13px; font-weight: 600;
        }
        .cover-footer { margin-top: 20px; font-size: 12px; color: #aaa; }

        /* 管理员入口 */
        .admin-entry {
            position: fixed; bottom: 16px; right: 16px;
            font-size: 12px; color: #ccc; cursor: pointer;
            z-index: 100; background: none; border: none;
            opacity: 0.4;
        }
        .admin-entry:hover { opacity: 1; color: #999; }

            display: none; position: fixed; top: 0; left: 0;

            z-index: 200; align-items: center; justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: white; border-radius: 20px; padding: 28px 22px;
            text-align: center; max-width: 320px; width: 90%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);

            width: 100%; padding: 12px 14px; font-size: 16px;
            border: 2px solid #ddd; border-radius: 30px;
            text-align: center; outline: none; margin-bottom: 10px;

            background: #5c6bc0; color: white; border: none;
            padding: 12px 28px; font-size: 16px; border-radius: 30px;
            cursor: pointer; font-weight: 600; width: 100%;
        }
        .modal-box .btn-cancel {
            background: #fff; color: #999; border: 1px solid #ddd;
            padding: 10px 28px; font-size: 14px; border-radius: 30px;
            cursor: pointer; margin-top: 6px; width: 100%;
        }
        .modal-error { color: #e53935; font-size: 13px; margin-bottom: 6px; display: none; }

            justify-content: flex-start; min-height: 100vh; padding: 20px;

        .quiz-page.active { display: flex; }
        .container { width: 100%; max-width: 420px; }

            background: white; border: none; color: #5c6bc0;

            padding: 10px 18px; border-radius: 30px; margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: inline-flex; align-items: center; gap: 4px;

            display: flex; gap: 8px; flex-wrap: wrap;
            margin-bottom: 12px; justify-content: center;
        }
        .wordbank-tab {
            background: white; border: 2px solid #ddd;
            padding: 8px 14px; font-size: 13px; border-radius: 20px;
            cursor: pointer; font-weight: 500; transition: all 0.2s;
        }
        .wordbank-tab:hover { border-color: #5c6bc0; }
        .wordbank-tab.active {
            background: #5c6bc0; color: white; border-color: #5c6bc0;
        }

        .card {
            background: white; border-radius: 24px; padding: 28px 20px;

            text-align: center; margin-bottom: 14px;

            margin-bottom: 4px; letter-spacing: 2px;

            align-items: center; justify-content: center;

        .btn-group { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 8px; }
        .btn {
            border: none; padding: 12px 20px; font-size: 16px;
            border-radius: 50px; cursor: pointer; transition: all 0.3s;
            font-weight: 600; box-shadow: 0 6px 14px rgba(0,0,0,0.1);
            display: inline-flex; align-items: center; gap: 4px;

        .btn:active { transform: scale(0.95); }
        .btn-start { background: #5c6bc0; color: white; }
        .btn-start:hover { background: #3949ab; }
        .btn-stop { background: #ef5350; color: white; }
        .btn-stop:hover { background: #c62828; }
        .feedback { margin-top: 16px; font-size: 19px; font-weight: 600; min-height: 30px; }
        .correct { color: #2e7d32; }
        .wrong { color: #c62828; }

        /* 评分显示 */
        .score-display {
            margin-top: 10px; font-size: 28px; font-weight: 800;
            min-height: 36px;
        }
        .score-high { color: #2e7d32; }
        .score-mid { color: #f57c00; }
        .score-low { color: #c62828; }

        /* 打字输入区 */
        .manual-input-area {
            display: flex; gap: 8px; margin-top: 10px; justify-content: center;
        }
        .manual-input {
            flex: 1; padding: 12px 14px; font-size: 16px;
            border: 2px solid #ddd; border-radius: 30px;
            outline: none; text-align: center; max-width: 180px;
        }
        .manual-input:focus { border-color: #5c6bc0; }
        .btn-submit {
            background: #ff9800; color: white; border: none;
            padding: 12px 18px; font-size: 16px; border-radius: 30px;
            cursor: pointer; font-weight: 600;
        }

        /* 词库管理区 */
        .word-list-section {
            background: white; border-radius: 24px; padding: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            display: none; margin-top: 10px;
        }
        .word-list-section.visible { display: block; }
        .section-title { font-weight: 700; color: #333; margin-bottom: 10px; font-size: 15px; }
        .word-count-info { font-size: 12px; color: #999; margin-bottom: 8px; }
        .file-import-area {
            border: 2px dashed #5c6bc0; border-radius: 14px;
            padding: 16px 12px; text-align: center; background: #f8f9ff;
            margin-bottom: 10px; cursor: pointer;
        }
        .file-import-area:hover { background: #eef0ff; }
        .file-import-icon { font-size: 30px; margin-bottom: 4px; }
        .file-import-text { font-size: 13px; color: #5c6bc0; font-weight: 600; }
        .file-import-sub { font-size: 11px; color: #999; margin-top: 2px; }
        #fileInput { display: none; }
        .file-name-display { font-size: 12px; color: #2e7d32; margin-top: 4px; }
        textarea {
            width: 100%; min-height: 80px; font-size: 13px;
            padding: 10px; border: 2px solid #ddd; border-radius: 10px;
            font-family: inherit; resize: vertical; outline: none;
        }
        textarea:focus { border-color: #5c6bc0; }
        .btn-load {
            background: #43a047; color: white; border: none;
            padding: 10px 18px; font-size: 14px; border-radius: 30px;
            cursor: pointer; margin-top: 8px; font-weight: 600; width: 100%;
        }
        .btn-load:hover { background: #2e7d32; }
        .btn-reset {
            background: #fff; color: #999; border: 1px solid #ddd;
            padding: 8px 16px; font-size: 13px; border-radius: 30px;
            cursor: pointer; margin-top: 6px; width: 100%;
        }
        .btn-logout {
            background: #fff; color: #e53935; border: 1px solid #e53935;
            padding: 8px 16px; font-size: 13px; border-radius: 20px;
            cursor: pointer; margin-top: 6px; width: 100%;
        }
        .hint { margin-top: 10px; color: #999; font-size: 12px; text-align: center; }

        @media (max-width: 400px) {
            .cover-title { font-size: 28px; }
            .cover-mode-card { width: 120px; padding: 18px 14px; }
            .word { font-size: 38px; }
        }
    </style>
</head>
<body>

    <!-- ==================== 封面页 ==================== -->
    <div class="cover-page" id="coverPage">

    <!-- 管理员入口 -->
    <button class="admin-entry" id="adminEntryBtn" onclick="showAdminLogin()">🔑 管理员</button>

    <!-- 密码弹窗 -->

            <div class="wordbank-tabs" id="wordbankTabs">

                <div class="wordbank-tab" data-bank="cet6" onclick="switchBank('cet6')">📙 六级高频</div>
                <div class="wordbank-tab" data-bank="kaoyan" onclick="switchBank('kaoyan')">📕 考研核心</div>
                <div class="wordbank-tab" data-bank="hotel" onclick="switchBank('hotel')">🏨 酒店英语</div>
            </div>

            <div class="card">
                <div class="word" id="wordDisplay">---</div>
                <div class="phonetic" id="phoneticDisplay"></div>
                <div class="progress" id="progressDisplay">准备开始</div>

                <div class="btn-group" id="voiceButtons">
                    <button class="btn btn-start" id="btnStart" onclick="startVoiceQuiz()">🎤 开始答题</button>
                    <button class="btn btn-stop" id="btnStop" onclick="stopQuiz()" style="display:none;">⏹️ 停止</button>
                </div>

                <div class="manual-input-area" id="typeInputArea" style="display:none;">
                    <input type="text" class="manual-input" id="manualInput" placeholder="输入中文意思" autocomplete="off">

                <div class="score-display" id="scoreDisplay"></div>
                <div class="feedback" id="feedbackDisplay"></div>

            <!-- 词库管理区（仅管理员可见） -->

                <div class="word-count-info" id="wordCountInfo">当前词库：0 个单词</div>
                <div class="file-import-area" id="fileDropZone" onclick="document.getElementById('fileInput').click()">

                    <div class="file-import-text">点击选择词库文件</div>
                    <div class="file-import-sub">支持 .txt 和 .csv</div>
                    <div class="file-name-display" id="fileNameDisplay"></div>
                </div>
                <input type="file" id="fileInput" accept=".txt,.csv" onchange="handleFileSelect(event)">
                <textarea id="wordListInput" placeholder="每行：英文,中文"></textarea>
                <button class="btn-load" onclick="loadFromTextarea()">📥 加载词库</button>
                <button class="btn-reset" onclick="resetToDefault()">🔄 恢复默认词库</button>
                <button class="btn-logout" onclick="logoutAdmin()">🚪 退出管理</button>

            <div class="hint">💡 语音模式：听音 → 跟读 → 评分</div>
        </div>

            isAdmin = false;
            wordListSection.classList.remove("visible");
            adminEntryBtn.textContent = "🔑 管理员";
            adminEntryBtn.style.color = "#ccc";
        }

        adminPasswordInput.addEventListener("keydown", function(e) {
            if (e.key === "Enter") verifyAdmin();
        });

        // ==================== 词库切换 ====================
        function switchBank(bank) {
            if (isQuizActive) stopQuiz();
            currentBank = bank;
            wordList = JSON.parse(JSON.stringify(builtinBanks[bank].words));
            saveCurrentBank();
            updateTabActive();
            updateWordListDisplay();
            updateQuizUI();
            updateCoverWordCount();
        }

        function updateTabActive() {
            document.querySelectorAll(".wordbank-tab").forEach(tab => {
                tab.classList.toggle("active", tab.dataset.bank === currentBank);
            });
        }

        function saveCurrentBank() {
            localStorage.setItem("currentBank", currentBank);
            localStorage.setItem("wordList_" + currentBank, JSON.stringify(wordList));
        }

        function loadCurrentBank() {
            const saved = localStorage.getItem("currentBank");
            if (saved && builtinBanks[saved]) {
                currentBank = saved;
            }
            const savedWords = localStorage.getItem("wordList_" + currentBank);
            if (savedWords) {
                try {
                    wordList = JSON.parse(savedWords);
                } catch (e) {
                    wordList = JSON.parse(JSON.stringify(builtinBanks[currentBank].words));
                }
            } else {
                wordList = JSON.parse(JSON.stringify(builtinBanks[currentBank].words));
            }
            updateTabActive();
            updateWordListDisplay();
            updateCoverWordCount();
        }

        // ==================== 页面切换 ====================
        function enterMode(mode) {
            currentMode = mode;
            coverPage.classList.add("hidden");
            quizPage.classList.add("active");
            if (isAdmin) wordListSection.classList.add("visible");

            if (mode === 'voice') {
                voiceButtons.style.display = 'flex';
                typeInputArea.style.display = 'none';
                btnStart.style.display = 'inline-flex';
                btnStop.style.display = 'none';
                scoreDisplay.textContent = '';
            } else {
                voiceButtons.style.display = 'none';
                typeInputArea.style.display = 'flex';
                scoreDisplay.textContent = '';
                startTypeMode();
            }
            updateQuizUI();
        }

        function goBack() {
            if (isQuizActive) stopQuiz();
            quizPage.classList.remove("active");
            coverPage.classList.remove("hidden");
            updateCoverWordCount();
        }

        function updateCoverWordCount() {
            coverWordCount.textContent = `当前词库：${builtinBanks[currentBank].name} · ${wordList.length} 个单词`;
        }

        function updateQuizUI() {
            wordDisplay.textContent = "---";
            phoneticDisplay.textContent = "";
            progressDisplay.textContent = "准备开始";
            feedbackDisplay.textContent = "";
            feedbackDisplay.className = "feedback";
            scoreDisplay.textContent = "";
            scoreDisplay.className = "score-display";
            btnStart.style.display = "inline-flex";
            btnStop.style.display = "none";
        }

        function updateWordCount() {
            wordCountInfo.textContent = `当前词库：${builtinBanks[currentBank].name} · ${wordList.length} 个单词`;
        }

        function updateWordListDisplay() {
            wordListInput.value = wordList.map(w => w.en + "," + w.ch).join("\n");
            updateWordCount();
            updateCoverWordCount();
        }

        // ==================== 文件导入（管理员） ====================
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            processFile(file);
        }

        function processFile(file) {
            fileNameDisplay.textContent = `📄 ${file.name}`;
            const reader = new FileReader();
            reader.onload = function(e) { parseAndLoad(e.target.result); };
            reader.readAsText(file, 'UTF-8');
        }

        function parseAndLoad(text) {
            if (isQuizActive) stopQuiz();
            const lines = text.split(/[\r\n]+/).filter(l => l.trim());
            const newList = [];
            for (let line of lines) {
                const parts = line.replace(/，/g, ',').replace(/\t/g, ',').split(',');
                if (parts.length >= 2 && parts[0].trim() && parts[1].trim()) {
                    newList.push({ en: parts[0].trim(), ch: parts[1].trim() });
                }
            }
            if (newList.length === 0) { alert('格式错误'); return; }
            wordList = newList;
            saveCurrentBank();
            updateWordListDisplay();
            updateQuizUI();
            feedbackDisplay.textContent = `✅ 已加载 ${wordList.length} 词`;
            feedbackDisplay.className = "feedback correct";
        }

        function loadFromTextarea() {
            if (!wordListInput.value.trim()) { alert('请粘贴词库'); return; }
            parseAndLoad(wordListInput.value);
        }

        function resetToDefault() {
            wordList = JSON.parse(JSON.stringify(builtinBanks[currentBank].words));
            saveCurrentBank();
            updateWordListDisplay();
            updateQuizUI();
            feedbackDisplay.textContent = "已恢复默认";
            feedbackDisplay.className = "feedback";
        }

        fileDropZone.addEventListener('dragover', e => { e.preventDefault(); fileDropZone.style.borderColor = '#3949ab'; });
        fileDropZone.addEventListener('dragleave', e => { e.preventDefault(); fileDropZone.style.borderColor = '#5c6bc0'; });
        fileDropZone.addEventListener('drop', e => {
            e.preventDefault();
            fileDropZone.style.borderColor = '#5c6bc0';
            if (e.dataTransfer.files[0]) processFile(e.dataTransfer.files[0]);
        });

        // ==================== 语音合成 ====================
        function speakText(text, lang = 'en-US', rate = 0.85) {
            return new Promise(r => {
                if (!('speechSynthesis' in window)) { r(); return; }
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.lang = lang; u.rate = rate;
                u.onend = () => r(); u.onerror = () => r();
                window.speechSynthesis.speak(u);
            });
        }

        // ==================== 语音识别 ====================
        function initRecognition(lang = 'en-US') {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) return null;
            const rec = new SR();
            rec.lang = lang;
            rec.interimResults = false;
            rec.maxAlternatives = 1;
            rec.continuous = false;
            return rec;
        }

        function startEnglishListening(callback) {
            recognition = initRecognition('en-US');
            if (!recognition) { callback(""); return; }
            recognition.onresult = e => callback(e.results[0][0].transcript.trim().toLowerCase());
            recognition.onerror = () => callback("");
            recognition.onend = () => {};
            try { recognition.start(); } catch (e) { callback(""); }
        }

        // ==================== 发音评分 ====================
        function calculateScore(userSpeech, targetWord) {
            const clean = userSpeech.replace(/[^a-z]/g, '');
            const target = targetWord.toLowerCase();
            if (!clean) return 0;
            if (clean === target) return 100;
            // 简单相似度算法
            let matches = 0;
            const minLen = Math.min(clean.length, target.length);
            for (let i = 0; i < minLen; i++) {
                if (clean[i] === target[i]) matches++;
            }
            const baseScore = Math.round((matches / target.length) * 80);
            const lengthPenalty = Math.abs(clean.length - target.length) * 5;
            return Math.max(0, Math.min(100, baseScore - lengthPenalty + 10));
        }

        // ==================== 语音答题流程 ====================
        async function startVoiceQuiz() {
            if (isQuizActive) return;
            if (wordList.length === 0) { alert('词库为空'); return; }
            currentIndex = 0;
            isQuizActive = true;
            btnStart.style.display = 'none';
            btnStop.style.display = 'inline-flex';
            showCurrentWord();
            await runVoiceRound();
        }

        async function runVoiceRound() {
            if (!isQuizActive) return;
            const word = wordList[currentIndex];
            expectedWord = word.en;
            wordDisplay.textContent = "🔊 请听发音...";
            feedbackDisplay.textContent = "";
            feedbackDisplay.className = "feedback";
            scoreDisplay.textContent = "";
            scoreDisplay.className = "score-display";

            // 播放发音
            await speakText(word.en, 'en-US', 0.85);
            await new Promise(r => setTimeout(r, 400));

            // 提示跟读
            wordDisplay.textContent = "🎙️ 请跟读";
            feedbackDisplay.textContent = "正在听...";
            feedbackDisplay.className = "feedback";

            // 开始识别
            startEnglishListening(async (userSpeech) => {
                if (!isQuizActive) return;
                const score = calculateScore(userSpeech, expectedWord);
                wordDisplay.textContent = expectedWord;

                // 显示评分
                scoreDisplay.textContent = `得分：${score} 分`;
                if (score >= 80) scoreDisplay.className = "score-display score-high";
                else if (score >= 50) scoreDisplay.className = "score-display score-mid";
                else scoreDisplay.className = "score-display score-low";

                // 反馈
                if (score >= 80) {
                    feedbackDisplay.textContent = "✅ 发音标准！";
                    feedbackDisplay.className = "feedback correct";
                } else if (score >= 50) {
                    feedbackDisplay.textContent = "⚠️ 还需练习";
                    feedbackDisplay.className = "feedback";
                } else {
                    feedbackDisplay.textContent = "❌ 请再试一次";
                    feedbackDisplay.className = "feedback wrong";
                }

                await new Promise(r => setTimeout(r, 1200));
                if (!isQuizActive) return;
                currentIndex++;
                if (currentIndex >= wordList.length) { finishQuiz(); return; }
                showCurrentWord();
                await runVoiceRound();
            });
        }

        function showCurrentWord() {
            const w = wordList[currentIndex];
            wordDisplay.textContent = w.en;
            phoneticDisplay.textContent = "";
            progressDisplay.textContent = `第 ${currentIndex + 1} 个 / 共 ${wordList.length} 个`;
        }

        function stopQuiz() {
            isQuizActive = false;
            if (recognition) { try { recognition.stop(); } catch (e) {} }
            window.speechSynthesis.cancel();
            btnStart.style.display = 'inline-flex';
            btnStop.style.display = 'none';
            updateQuizUI();
        }

        async function finishQuiz() {
            isQuizActive = false;
            if (recognition) { try { recognition.stop(); } catch (e) {} }
            window.speechSynthesis.cancel();
            wordDisplay.textContent = '🎉';
            scoreDisplay.textContent = '';
            progressDisplay.textContent = '全部完成！';
            feedbackDisplay.textContent = '太棒了！';
            feedbackDisplay.className = 'feedback correct';
            await speakText('太厉害了', 'zh-CN', 0.9);
            btnStart.style.display = 'inline-flex';
            btnStop.style.display = 'none';
        }

        // ==================== 打字模式 ====================
        function startTypeMode() {
            if (wordList.length === 0) return;
            currentIndex = 0;
            isQuizActive = true;
            showCurrentWord();
            manualInput.value = '';
            manualInput.focus();
            feedbackDisplay.textContent = '';
            feedbackDisplay.className = 'feedback';
            speakText(wordList[currentIndex].en, 'en-US', 0.85);
        }

        function submitManualAnswer() {
            if (!isQuizActive || currentMode !== 'type') return;
            const userAnswer = manualInput.value.trim();
            if (!userAnswer) return;
            const correct = wordList[currentIndex].ch;
            if (userAnswer.includes(correct) || correct.includes(userAnswer)) {
                feedbackDisplay.textContent = '✅ 正确！';
                feedbackDisplay.className = 'feedback correct';
            } else {
                feedbackDisplay.textContent = `❌ 答案是：${correct}`;
                feedbackDisplay.className = 'feedback wrong';
            }
            manualInput.value = '';
            setTimeout(() => {
                if (!isQuizActive) return;
                currentIndex++;
                if (currentIndex >= wordList.length) { finishTypeQuiz(); return; }
                showCurrentWord();
                manualInput.focus();
                feedbackDisplay.textContent = '';
                feedbackDisplay.className = 'feedback';
                speakText(wordList[currentIndex].en, 'en-US', 0.85);
            }, 800);
        }

        function finishTypeQuiz() {
            isQuizActive = false;
            wordDisplay.textContent = '🎉';
            progressDisplay.textContent = '全部完成！';
            feedbackDisplay.textContent = '太棒了！';
            feedbackDisplay.className = 'feedback correct';
            manualInput.value = '';
        }

        manualInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') submitManualAnswer();
        });

        // ==================== 初始化 ====================
        window.onload = () => {
            loadCurrentBank();
            voiceButtons.style.display = 'flex';
            typeInputArea.style.display = 'none';
            btnStart.style.display = 'inline-flex';
            btnStop.style.display = 'none';
            updateCoverWordCount();
        };
    </script>
</body>
</html>
