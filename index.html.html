<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>语音背单词</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            user-select: none;
            background: linear-gradient(135deg, #e0f7fa, #f3e5f5);
            min-height: 100vh;
        }

        /* ==================== 封面页 ==================== */
        .cover-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 30px;
            text-align: center;
        }
        .cover-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
        .cover-title {
            font-size: 36px;
            font-weight: 800;
            color: #1a237e;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }
        .cover-subtitle {
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .cover-features {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 36px;
        }
        .cover-feature-item {
            background: white;
            border-radius: 16px;
            padding: 16px 20px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
            font-size: 14px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }
        .cover-btn {
            background: linear-gradient(135deg, #5c6bc0, #3949ab);
            color: white;
            border: none;
            padding: 18px 50px;
            font-size: 22px;
            font-weight: 700;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 12px 32px rgba(92, 107, 192, 0.4);
            transition: all 0.3s ease;
            letter-spacing: 2px;
        }
        .cover-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 16px 40px rgba(92, 107, 192, 0.6);
        }
        .cover-btn:active {
            transform: scale(0.96);
        }
        .cover-footer {
            margin-top: 30px;
            font-size: 13px;
            color: #aaa;
        }
        .cover-word-count {
            background: rgba(92,107,192,0.1);
            color: #5c6bc0;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-top: 12px;
        }

        /* ==================== 答题页 ==================== */
        .quiz-page {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 20px;
        }
        .quiz-page.active {
            display: flex;
        }
        .cover-page.hidden {
            display: none;
        }

        .container {
            width: 100%;
            max-width: 420px;
        }
        .back-btn {
            background: white;
            border: none;
            color: #5c6bc0;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            padding: 10px 18px;
            border-radius: 30px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }
        .back-btn:hover {
            background: #f0f0ff;
        }
        .card {
            background: white;
            border-radius: 24px;
            padding: 30px 22px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
            margin-bottom: 16px;
        }
        .word {
            font-size: 48px;
            font-weight: 700;
            color: #1a237e;
            margin-bottom: 6px;
            letter-spacing: 2px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .phonetic {
            font-size: 16px;
            color: #888;
            margin-bottom: 8px;
            min-height: 22px;
        }
        .progress {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 18px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        .btn {
            border: none;
            padding: 13px 22px;
            font-size: 17px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            box-shadow: 0 6px 16px rgba(0,0,0,0.12);
            display: inline-flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn:disabled {
            opacity: 0.5;
            pointer-events: none;
        }
        .btn-start {
            background: #5c6bc0;
            color: white;
        }
        .btn-start:hover {
            background: #3949ab;
        }
        .btn-stop {
            background: #ef5350;
            color: white;
        }
        .btn-stop:hover {
            background: #c62828;
        }
        .btn-type {
            background: #fff;
            color: #5c6bc0;
            border: 2px solid #5c6bc0;
        }
        .btn-type:hover {
            background: #f0f0ff;
        }
        .btn-type.active {
            background: #5c6bc0;
            color: white;
        }
        .feedback {
            margin-top: 18px;
            font-size: 20px;
            font-weight: 600;
            min-height: 32px;
            transition: all 0.2s;
        }
        .correct { color: #2e7d32; }
        .wrong { color: #c62828; }
        .manual-input-area {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            justify-content: center;
        }
        .manual-input {
            flex: 1;
            padding: 12px 16px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 30px;
            outline: none;
            text-align: center;
            max-width: 180px;
        }
        .manual-input:focus {
            border-color: #5c6bc0;
        }
        .btn-submit {
            background: #ff9800;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-submit:hover {
            background: #f57c00;
        }
        .divider {
            border: none;
            border-top: 1px solid #eee;
            margin: 14px 0;
        }
        .word-list-section {
            background: white;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
        }
        .section-title {
            font-weight: 700;
            color: #333;
            margin-bottom: 12px;
            font-size: 16px;
        }
        .word-count-info {
            font-size: 13px;
            color: #999;
            margin-bottom: 10px;
        }
        .file-import-area {
            border: 2px dashed #5c6bc0;
            border-radius: 16px;
            padding: 20px 15px;
            text-align: center;
            background: #f8f9ff;
            margin-bottom: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .file-import-area:hover {
            background: #eef0ff;
            border-color: #3949ab;
        }
        .file-import-icon {
            font-size: 36px;
            margin-bottom: 6px;
        }
        .file-import-text {
            font-size: 14px;
            color: #5c6bc0;
            font-weight: 600;
        }
        .file-import-sub {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }
        #fileInput {
            display: none;
        }
        .file-name-display {
            font-size: 13px;
            color: #2e7d32;
            margin-top: 6px;
            font-weight: 500;
        }
        textarea {
            width: 100%;
            min-height: 100px;
            font-size: 14px;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-family: inherit;
            resize: vertical;
            outline: none;
        }
        textarea:focus {
            border-color: #5c6bc0;
        }
        .btn-load {
            background: #43a047;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: 600;
            width: 100%;
        }
        .btn-load:hover {
            background: #2e7d32;
        }
        .btn-reset {
            background: #fff;
            color: #999;
            border: 1px solid #ddd;
            padding: 10px 20px;
            font-size: 14px;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 8px;
            width: 100%;
        }
        .btn-reset:hover {
            background: #f5f5f5;
        }
        .btn-download {
            background: #fff;
            color: #5c6bc0;
            border: 1px solid #5c6bc0;
            padding: 10px 20px;
            font-size: 14px;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 8px;
            width: 100%;
        }
        .btn-download:hover {
            background: #f0f0ff;
        }
        .hint {
            margin-top: 12px;
            color: #999;
            font-size: 13px;
            text-align: center;
        }

        /* ==================== 响应式 ==================== */
        @media (max-width: 400px) {
            .cover-title { font-size: 28px; }
            .cover-btn { padding: 16px 40px; font-size: 20px; }
            .word { font-size: 40px; }
        }
    </style>
</head>
<body>

    <!-- ==================== 封面页 ==================== -->
    <div class="cover-page" id="coverPage">
        <div class="cover-icon">📚</div>
        <div class="cover-title">语音背单词</div>
        <div class="cover-subtitle">听发音 · 说答案 · 练口语</div>
        <div class="cover-features">
            <div class="cover-feature-item">🎤 语音答题</div>
            <div class="cover-feature-item">⌨️ 打字模式</div>
            <div class="cover-feature-item">📂 导入词库</div>
            <div class="cover-feature-item">📱 手机可用</div>
        </div>
        <div class="cover-word-count" id="coverWordCount">当前词库：0 个单词</div>
        <button class="cover-btn" onclick="enterQuiz()">🚀 开始学习</button>
        <div class="cover-footer">💡 支持四级 / 考研 / 自定义词库</div>
    </div>

    <!-- ==================== 答题页 ==================== -->
    <div class="quiz-page" id="quizPage">
        <div class="container">
            <button class="back-btn" onclick="goBack()">← 返回首页</button>

            <div class="card">
                <div class="word" id="wordDisplay">---</div>
                <div class="phonetic" id="phoneticDisplay"></div>
                <div class="progress" id="progressDisplay">准备开始</div>

                <div class="btn-group" style="margin-bottom:6px;">
                    <button class="btn btn-type active" id="btnModeVoice" onclick="switchMode('voice')">🎤 语音模式</button>
                    <button class="btn btn-type" id="btnModeType" onclick="switchMode('type')">⌨️ 打字模式</button>
                </div>

                <div class="btn-group" id="voiceButtons">
                    <button class="btn btn-start" id="btnStart" onclick="startQuiz()">🎤 开始答题</button>
                    <button class="btn btn-stop" id="btnStop" onclick="stopQuiz()" style="display:none;">⏹️ 停止</button>
                </div>

                <div class="manual-input-area" id="typeInputArea" style="display:none;">
                    <input type="text" class="manual-input" id="manualInput" placeholder="输入中文意思" autocomplete="off">
                    <button class="btn-submit" onclick="submitManualAnswer()">确认</button>
                </div>

                <div class="feedback" id="feedbackDisplay"></div>
            </div>

            <div class="word-list-section">
                <div class="section-title">📚 词库管理</div>
                <div class="word-count-info" id="wordCountInfo">当前词库：0 个单词</div>

                <div class="file-import-area" id="fileDropZone" onclick="document.getElementById('fileInput').click()">
                    <div class="file-import-icon">📂</div>
                    <div class="file-import-text">点击选择词库文件（或拖拽到此处）</div>
                    <div class="file-import-sub">支持 .txt 和 .csv 文件</div>
                    <div class="file-name-display" id="fileNameDisplay"></div>
                </div>
                <input type="file" id="fileInput" accept=".txt,.csv" onchange="handleFileSelect(event)">

                <textarea id="wordListInput" placeholder="也可以手动粘贴词库：
每行一个单词，格式：英文,中文

示例：
apple,苹果
abandon,放弃"></textarea>
                <button class="btn-load" onclick="loadFromTextarea()">📥 从文本框加载</button>
                <button class="btn-download" onclick="downloadSample()">📥 下载示例词库文件</button>
                <button class="btn-reset" onclick="resetToDefault()">🔄 恢复默认词库</button>
            </div>

            <div class="hint">💡 支持直接上传词库文件 | 也可手动粘贴 | 自动保存</div>
        </div>
    </div>

    <script>
        // ==================== 全局状态 ====================
        let currentIndex = 0;
        let isQuizActive = false;
        let recognition = null;
        let currentMode = 'voice';
        let wordList = [];

        const defaultWordList = [
            { en: "apple", ch: "苹果", phonetic: "/ˈæp.əl/" },
            { en: "abandon", ch: "放弃", phonetic: "/əˈbæn.dən/" },
            { en: "ability", ch: "能力", phonetic: "/əˈbɪl.ə.ti/" },
            { en: "abroad", ch: "在国外", phonetic: "/əˈbrɔːd/" },
            { en: "absent", ch: "缺席的", phonetic: "/ˈæb.sənt/" },
            { en: "absorb", ch: "吸收", phonetic: "/əbˈzɔːrb/" },
            { en: "abstract", ch: "抽象的", phonetic: "/ˈæb.strækt/" },
            { en: "abundant", ch: "丰富的", phonetic: "/əˈbʌn.dənt/" },
            { en: "academic", ch: "学术的", phonetic: "/ˌæk.əˈdem.ɪk/" },
            { en: "accelerate", ch: "加速", phonetic: "/əkˈsel.ə.reɪt/" },
            { en: "access", ch: "进入；通道", phonetic: "/ˈæk.ses/" },
            { en: "accompany", ch: "陪伴", phonetic: "/əˈkʌm.pə.ni/" },
            { en: "accomplish", ch: "完成", phonetic: "/əˈkʌm.plɪʃ/" },
            { en: "accurate", ch: "准确的", phonetic: "/ˈæk.jə.rət/" },
            { en: "achieve", ch: "实现", phonetic: "/əˈtʃiːv/" },
            { en: "acknowledge", ch: "承认", phonetic: "/əkˈnɒl.ɪdʒ/" },
            { en: "acquire", ch: "获得", phonetic: "/əˈkwaɪər/" },
            { en: "adapt", ch: "适应", phonetic: "/əˈdæpt/" },
            { en: "adequate", ch: "足够的", phonetic: "/ˈæd.ə.kwət/" },
            { en: "adjust", ch: "调整", phonetic: "/əˈdʒʌst/" },
            { en: "administration", ch: "管理", phonetic: "/ədˌmɪn.ɪˈstreɪ.ʃən/" },
            { en: "admire", ch: "钦佩", phonetic: "/ədˈmaɪər/" },
            { en: "admit", ch: "承认", phonetic: "/ədˈmɪt/" },
            { en: "adopt", ch: "采用", phonetic: "/əˈdɒpt/" },
            { en: "advance", ch: "前进", phonetic: "/ədˈvɑːns/" },
            { en: "advantage", ch: "优势", phonetic: "/ədˈvɑːn.tɪdʒ/" },
            { en: "advertise", ch: "做广告", phonetic: "/ˈæd.və.taɪz/" },
            { en: "affair", ch: "事务", phonetic: "/əˈfeər/" },
            { en: "affect", ch: "影响", phonetic: "/əˈfekt/" },
            { en: "afford", ch: "负担得起", phonetic: "/əˈfɔːrd/" },
        ];

        // 页面元素
        const coverPage = document.getElementById("coverPage");
        const quizPage = document.getElementById("quizPage");
        const coverWordCount = document.getElementById("coverWordCount");
        const wordDisplay = document.getElementById("wordDisplay");
        const phoneticDisplay = document.getElementById("phoneticDisplay");
        const progressDisplay = document.getElementById("progressDisplay");
        const feedbackDisplay = document.getElementById("feedbackDisplay");
        const btnStart = document.getElementById("btnStart");
        const btnStop = document.getElementById("btnStop");
        const btnModeVoice = document.getElementById("btnModeVoice");
        const btnModeType = document.getElementById("btnModeType");
        const voiceButtons = document.getElementById("voiceButtons");
        const typeInputArea = document.getElementById("typeInputArea");
        const manualInput = document.getElementById("manualInput");
        const wordListInput = document.getElementById("wordListInput");
        const wordCountInfo = document.getElementById("wordCountInfo");
        const fileNameDisplay = document.getElementById("fileNameDisplay");
        const fileDropZone = document.getElementById("fileDropZone");
        const fileInput = document.getElementById("fileInput");

        // ==================== 页面切换 ====================
        function enterQuiz() {
            coverPage.classList.add("hidden");
            quizPage.classList.add("active");
            updateQuizUI();
        }

        function goBack() {
            if (isQuizActive) stopQuiz();
            quizPage.classList.remove("active");
            coverPage.classList.remove("hidden");
            updateCoverWordCount();
        }

        function updateCoverWordCount() {
            coverWordCount.textContent = `当前词库：${wordList.length} 个单词`;
        }

        function updateQuizUI() {
            wordDisplay.textContent = "---";
            phoneticDisplay.textContent = "";
            progressDisplay.textContent = "准备开始";
            feedbackDisplay.textContent = "";
            feedbackDisplay.className = "feedback";
            btnStart.style.display = "inline-flex";
            btnStop.style.display = "none";
            updateWordCount();
        }

        // ==================== 初始化 ====================
        function initWordList() {
            const saved = localStorage.getItem("voiceWordList");
            if (saved) {
                try {
                    wordList = JSON.parse(saved);
                    if (wordList.length > 0) {
                        updateWordListDisplay();
                        updateCoverWordCount();
                        return;
                    }
                } catch (e) {}
            }
            wordList = JSON.parse(JSON.stringify(defaultWordList));
            updateWordListDisplay();
            updateCoverWordCount();
        }

        function saveWordList() {
            localStorage.setItem("voiceWordList", JSON.stringify(wordList));
            updateWordCount();
            updateCoverWordCount();
        }

        function updateWordCount() {
            wordCountInfo.textContent = `当前词库：${wordList.length} 个单词`;
        }

        function updateWordListDisplay() {
            const lines = wordList.map(w => {
                if (w.phonetic) return `${w.en},${w.ch},${w.phonetic}`;
                return `${w.en},${w.ch}`;
            });
            wordListInput.value = lines.join("\n");
            updateWordCount();
            updateCoverWordCount();
        }

        // ==================== 文件导入 ====================
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            processFile(file);
        }

        function processFile(file) {
            fileNameDisplay.textContent = `📄 已选择：${file.name}`;
            const reader = new FileReader();
            reader.onload = function(e) {
                parseAndLoad(e.target.result);
            };
            reader.readAsText(file, 'UTF-8');
        }

        function parseAndLoad(text) {
            if (isQuizActive) stopQuiz();
            const lines = text.split(/[\r\n]+/).filter(line => line.trim() !== '');
            const newList = [];
            for (let line of lines) {
                const parts = line.replace(/，/g, ',').replace(/\t/g, ',').split(',');
                if (parts.length >= 2 && parts[0].trim() && parts[1].trim()) {
                    newList.push({
                        en: parts[0].trim(),
                        ch: parts[1].trim(),
                        phonetic: parts.length >= 3 ? parts[2].trim() : ''
                    });
                }
            }
            if (newList.length === 0) {
                alert('未能解析到有效单词，请检查文件格式（每行：英文,中文）');
                return;
            }
            wordList = newList;
            saveWordList();
            updateWordListDisplay();
            updateQuizUI();
            feedbackDisplay.textContent = `✅ 已加载 ${wordList.length} 个单词`;
            feedbackDisplay.className = 'feedback correct';
        }

        function loadFromTextarea() {
            const text = wordListInput.value;
            if (!text.trim()) {
                alert('请先粘贴词库内容或选择文件');
                return;
            }
            parseAndLoad(text);
        }

        function downloadSample() {
            const sample = `apple,苹果,/ˈæp.əl/
abandon,放弃
ability,能力
abroad,在国外
absent,缺席的
absorb,吸收
abstract,抽象的
abundant,丰富的
academic,学术的
accelerate,加速`;
            const blob = new Blob([sample], { type: 'text/plain;charset=UTF-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = '词库示例.txt';
            a.click();
            URL.revokeObjectURL(url);
        }

        // 拖拽上传
        fileDropZone.addEventListener('dragover', function(e) {
            e.preventDefault();
            this.style.borderColor = '#3949ab';
            this.style.background = '#eef0ff';
        });
        fileDropZone.addEventListener('dragleave', function(e) {
            e.preventDefault();
            this.style.borderColor = '#5c6bc0';
            this.style.background = '#f8f9ff';
        });
        fileDropZone.addEventListener('drop', function(e) {
            e.preventDefault();
            this.style.borderColor = '#5c6bc0';
            this.style.background = '#f8f9ff';
            const file = e.dataTransfer.files[0];
            if (file) processFile(file);
        });

        // ==================== 模式切换 ====================
        function switchMode(mode) {
            if (isQuizActive) stopQuiz();
            currentMode = mode;
            if (mode === 'voice') {
                btnModeVoice.classList.add('active');
                btnModeType.classList.remove('active');
                voiceButtons.style.display = 'flex';
                typeInputArea.style.display = 'none';
                btnStart.style.display = 'inline-flex';
                btnStop.style.display = 'none';
                feedbackDisplay.textContent = '';
            } else {
                btnModeType.classList.add('active');
                btnModeVoice.classList.remove('active');
                voiceButtons.style.display = 'none';
                typeInputArea.style.display = 'flex';
                feedbackDisplay.textContent = '';
                if (wordList.length > 0) startTypeMode();
            }
        }

        // ==================== 语音合成 ====================
        function speakText(text, lang = 'en-US', rate = 0.85) {
            return new Promise((resolve) => {
                if (!('speechSynthesis' in window)) { resolve(); return; }
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang;
                utterance.rate = rate;
                utterance.pitch = 1.0;
                utterance.onend = () => resolve();
                utterance.onerror = () => resolve();
                window.speechSynthesis.speak(utterance);
            });
        }
        async function speakWord(word) { await speakText(word, 'en-US', 0.85); }
        async function speakFeedback(text) { await speakText(text, 'zh-CN', 0.9); }

        // ==================== 语音识别 ====================
        function initRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return null;
            const rec = new SpeechRecognition();
            rec.lang = 'zh-CN';
            rec.interimResults = false;
            rec.maxAlternatives = 1;
            rec.continuous = false;
            rec.onresult = (event) => {
                handleAnswer(event.results[0][0].transcript.trim());
            };
            rec.onerror = (event) => {
                if (event.error === 'no-speech') {
                    feedbackDisplay.textContent = '🤔 没有听到声音，正在重试...';
                    if (isQuizActive) setTimeout(() => startListening(), 600);
                } else if (event.error !== 'aborted') {
                    if (isQuizActive) setTimeout(() => startListening(), 800);
                }
            };
            return rec;
        }

        function startListening() {
            if (!isQuizActive || currentMode !== 'voice') return;
            if (!recognition) recognition = initRecognition();
            if (!recognition) return;
            try {
                recognition.start();
                feedbackDisplay.textContent = '🎙️ 正在听你说...';
                feedbackDisplay.className = 'feedback';
            } catch (e) {
                recognition.stop();
                setTimeout(() => { if (isQuizActive) startListening(); }, 200);
            }
        }

        function stopListening() {
            if (recognition) { try { recognition.stop(); } catch (e) {} }
        }

        // ==================== 答题逻辑 ====================
        async function handleAnswer(userAnswer) {
            if (!isQuizActive) return;
            const correctAnswer = wordList[currentIndex].ch;
            const cleanUser = userAnswer.replace(/[，。！？、\s，,\.!\?]/g, '');
            const isCorrect = cleanUser.includes(correctAnswer) || correctAnswer.includes(cleanUser);
            if (isCorrect) {
                feedbackDisplay.textContent = '✅ 正确！';
                feedbackDisplay.className = 'feedback correct';
                await speakFeedback('答对了');
            } else {
                feedbackDisplay.textContent = `❌ 错误，正确答案是：${correctAnswer}`;
                feedbackDisplay.className = 'feedback wrong';
                await speakFeedback('答错了');
            }
            if (!isQuizActive) return;
            await new Promise(r => setTimeout(r, 600));
            advanceToNext();
        }

        function advanceToNext() {
            currentIndex++;
            if (currentIndex >= wordList.length) { finishQuiz(); return; }
            showCurrentWord();
            if (currentMode === 'voice') { readAndListen(); }
            else if (currentMode === 'type') {
                speakWord(wordList[currentIndex].en);
                manualInput.value = '';
                manualInput.focus();
                feedbackDisplay.textContent = '';
                feedbackDisplay.className = 'feedback';
            }
        }

        function showCurrentWord() {
            const word = wordList[currentIndex];
            wordDisplay.textContent = word.en;
            phoneticDisplay.textContent = word.phonetic || '';
            progressDisplay.textContent = `第 ${currentIndex + 1} 个 / 共 ${wordList.length} 个`;
            feedbackDisplay.textContent = '';
            feedbackDisplay.className = 'feedback';
        }

        async function readAndListen() {
            if (!isQuizActive || currentMode !== 'voice') return;
            await speakWord(wordList[currentIndex].en);
            if (isQuizActive && currentMode === 'voice') startListening();
        }

        async function startQuiz() {
            if (isQuizActive) return;
            if (wordList.length === 0) { alert('词库为空，请先加载词库！'); return; }
            currentIndex = 0;
            isQuizActive = true;
            btnStart.style.display = 'none';
            btnStop.style.display = 'inline-flex';
            showCurrentWord();
            await new Promise(r => setTimeout(r, 300));
            await readAndListen();
        }

        function stopQuiz() {
            isQuizActive = false;
            stopListening();
            window.speechSynthesis.cancel();
            btnStart.style.display = 'inline-flex';
            btnStop.style.display = 'none';
            feedbackDisplay.textContent = '答题已停止';
            feedbackDisplay.className = 'feedback';
            progressDisplay.textContent = '准备开始';
            wordDisplay.textContent = '---';
            phoneticDisplay.textContent = '';
            manualInput.value = '';
            currentIndex = 0;
        }

        async function finishQuiz() {
            isQuizActive = false;
            stopListening();
            window.speechSynthesis.cancel();
            wordDisplay.textContent = '🎉';
            phoneticDisplay.textContent = '';
            progressDisplay.textContent = '恭喜，全部完成！';
            feedbackDisplay.textContent = '你太棒了！';
            feedbackDisplay.className = 'feedback correct';
            await speakFeedback('太厉害了，全部答完啦！');
            btnStart.style.display = 'inline-flex';
            btnStop.style.display = 'none';
            manualInput.value = '';
        }

        // ==================== 打字模式 ====================
        function startTypeMode() {
            if (wordList.length === 0) { feedbackDisplay.textContent = '请先加载词库'; return; }
            currentIndex = 0;
            isQuizActive = true;
            showCurrentWord();
            manualInput.value = '';
            manualInput.focus();
            feedbackDisplay.textContent = '';
            feedbackDisplay.className = 'feedback';
            speakWord(wordList[currentIndex].en);
        }

        function submitManualAnswer() {
            if (!isQuizActive || currentMode !== 'type') return;
            const userAnswer = manualInput.value.trim();
            if (!userAnswer) { feedbackDisplay.textContent = '请输入答案'; feedbackDisplay.className = 'feedback wrong'; return; }
            handleAnswer(userAnswer);
        }

        manualInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') submitManualAnswer();
        });

        function resetToDefault() {
            if (isQuizActive) stopQuiz();
            wordList = JSON.parse(JSON.stringify(defaultWordList));
            localStorage.removeItem("voiceWordList");
            updateWordListDisplay();
            updateQuizUI();
            feedbackDisplay.textContent = '已恢复默认词库（30个单词）';
            feedbackDisplay.className = 'feedback';
            fileNameDisplay.textContent = '';
        }

        // ==================== 页面加载 ====================
        window.onload = () => {
            initWordList();
            btnStart.style.display = 'inline-flex';
            btnStop.style.display = 'none';
            voiceButtons.style.display = 'flex';
            typeInputArea.style.display = 'none';
            wordDisplay.textContent = '---';
            phoneticDisplay.textContent = '';
            progressDisplay.textContent = '准备开始';
        };
    </script>
</body>
</html>
